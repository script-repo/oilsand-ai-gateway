apiVersion: v1
kind: ConfigMap
metadata:
  name: olla-config
  namespace: ai-local
data:
  olla.yaml: |
    discovery:
      type: static
      static:
        endpoints:
          - name: ollama-gpu-01
            url: http://ollama-svc-01.ai-local.svc.cluster.local:11434
            type: ollama
            priority: 100
            check_interval: 10s
            check_timeout: 3s
          - name: ollama-gpu-02
            url: http://ollama-svc-02.ai-local.svc.cluster.local:11434
            type: ollama
            priority: 100
            check_interval: 10s
            check_timeout: 3s
          - name: ollama-gpu-03
            url: http://ollama-svc-03.ai-local.svc.cluster.local:11434
            type: ollama
            priority: 75
            check_interval: 10s
            check_timeout: 3s
    proxy:
      load_balancer: least-connections
    server:
      port: 40114
      rate_limits:
        per_ip_requests_per_minute: 300
        global_requests_per_minute: 5000
    logging:
      level: info
      format: json
