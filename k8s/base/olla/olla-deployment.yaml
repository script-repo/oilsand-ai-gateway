apiVersion: apps/v1
kind: Deployment
metadata:
  name: olla
  namespace: ai-local
  labels:
    app: olla
spec:
  replicas: 2
  selector:
    matchLabels:
      app: olla
  template:
    metadata:
      labels:
        app: olla
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40114"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: olla
          image: ghcr.io/thushan/olla:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config/olla.yaml"]
          ports:
            - containerPort: 40114
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 40114
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 40114
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: olla-config
---
apiVersion: v1
kind: Service
metadata:
  name: olla-svc
  namespace: ai-local
  labels:
    app: olla
spec:
  type: ClusterIP
  selector:
    app: olla
  ports:
    - name: http
      port: 40114
      targetPort: 40114
      protocol: TCP
