apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-node-02
  namespace: ai-local
  labels:
    app: ollama
    instance: "02"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
      instance: "02"
  template:
    metadata:
      labels:
        app: ollama
        instance: "02"
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        nvidia.com/gpu.present: "true"
        accelerator: l40s
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
              memory: 16Gi
              cpu: "4"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc-02
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-svc-02
  namespace: ai-local
  labels:
    app: ollama
    instance: "02"
spec:
  type: ClusterIP
  selector:
    app: ollama
    instance: "02"
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
